# Bundle manifest read by tools/validate.py. Add a category or section here before using it in wiki/.
manifest_version: 1
okf_version: '0.2'
slug: nist-csf
name: NIST CSF Knowledge Base
description: 'NIST Cybersecurity Framework 2.0: functions, categories and subcategories, profiles and tiers, informative references,
  implementation examples, and crosswalks to EU law.'
extension_key: x-nist-csf
categories:
- outcome
- profile
- mapping
- requirement
- guidance
- standard
- procedure
- law
- timeline
- glossary
sections:
- path: framework
  title: Framework
  description: 'The CSF Core: one page per function, category and subcategory, with the identifier used verbatim and the gaps
    in numbering preserved.'
- path: profiles
  title: Profiles
  description: How organisations use the Core.
- path: informative-references
  title: Informative references
  description: NIST's OLIR mappings from subcategories to SP 800-53 Rev. 5, SP 800-221A, CIS Controls, ISO/IEC 27001 clause
    identifiers, CSF 1.1 and others, with the NIST IR 8477 relationship type recorded.
- path: crosswalks
  title: Crosswalks
  description: This bundle's own mappings from subcategories to EU instruments, labelled inferred until an official mapping
    exists, using NIST IR 8477 relationship styles.
- path: guidance
  title: Guidance
  description: NIST resources around the framework.
- path: timeline
  title: Timeline
  description: Executive Order 13636, CSF 1.0, 1.1 and 2.0 publication, informative-reference updates, Quick Start Guide releases.
- path: glossary
  title: Glossary
  description: Terms as defined in CSWP 29 and NIST IR 8477.
